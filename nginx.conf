# /etc/nginx/nginx.conf

# njs dynamic module — bundled with the official nginx:alpine image.
# Required for the /raw endpoint that serves decoded UVL content to UVLHub.
load_module modules/ngx_http_js_module.so;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    js_path "/etc/nginx/njs/";
    js_import raw from raw.js;

    # Toggle the Connection header for WebSocket upgrades (used by /collab).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # Decodes a base64 UVL model from ?model= and returns it as plain text
        # so that UVLHub can fetch the raw UVL content server-side.
        location /raw {
            js_content raw.handler;
        }

        # Collaboration backend (Y.js WebSocket server) running in this same
        # container. The trailing slash on proxy_pass strips the /collab/ prefix,
        # so the frontend connecting to ws(s)://<host>/collab/<doc> reaches the
        # server as /<doc>, and the /collab/health probe maps to /health.
        location /collab/ {
            proxy_pass http://127.0.0.1:1234/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
        }

        location / {
            try_files $uri /index.html;
            # Cross-origin isolation enables SharedArrayBuffer, used to
            # interrupt running Pyodide operations without a full reload.
            # `credentialless` keeps third-party scripts (Google Analytics)
            # loadable; on browsers without support (Safari) the IDE falls
            # back to restarting the worker.
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header Cross-Origin-Embedder-Policy "credentialless" always;
        }

        gzip on;
        gzip_types text/css application/javascript application/json image/svg+xml;
        gzip_min_length 1000;
    }
}
