name: Docker Image & deploy

# Build & publish the Docker image and trigger the Render deploy whenever main
# changes. (Previously chained to the release-please workflow via workflow_run;
# that release workflow has been removed.)
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_API_TOKEN }}

      - name: Build the Docker image
        run: docker build . --file Dockerfile --tag flamapy/flamapy-ide:latest --build-arg VITE_GA_MEASUREMENT_ID=${{ secrets.VITE_GA_MEASUREMENT_ID }}

      - name: Push the Docker image
        run: docker push flamapy/flamapy-ide:latest

  deploy:
    needs: build-and-publish
    runs-on: ubuntu-latest

    steps:
      - name: Deploy
        env:
          deploy_url: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl "$deploy_url"
