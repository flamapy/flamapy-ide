name: Run Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The flamapy wheels served to the browser are not tracked in git (see
      # .gitignore); regenerate them so the tests run against the same artifacts
      # the browser loads. The flamapy-authored wheels come from the flamapy GitHub
      # release bundle; GITHUB_TOKEN lifts the API rate limit.
      - name: Build flamapy wheels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make build-wheels

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Install the exact flamapy wheels served to the browser (not a PyPI
          # pin), so the tests run against the shipped artifacts: the core and the
          # plugins booted by default, as listed in plugins.conf.json. Optional
          # plugins (SDD, #SAT) are left out: their native deps only ship as WASM
          # wheels, and flamapy imports every installed plugin. WASM wheels are
          # skipped too; native z3-solver/python-sat come from requirements.txt.
          pip install --no-deps $(python scripts/default_boot_wheels.py)
          # Native solver backends + test tooling (python-sat, z3-solver, pytest).
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest --cov=public tests/
