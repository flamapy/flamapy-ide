name: Deploy to GitHub Pages

# Production deploy is tag-driven: a non-dev version tag (v1.2.3) publishes the
# site. Dev tags (v1.2.3.dev0) are previews and do not deploy. Pushing to main
# no longer deploys.
on:
  push:
    tags:
      - v[0-9]+.[0-9]+.*
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.ref, 'dev') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      # The flamapy wheels served to the browser are not tracked in git (see
      # .gitignore); regenerate them before the build so Vite copies them into
      # dist/. The flamapy-authored wheels come from the flamapy GitHub release
      # bundle; GITHUB_TOKEN lifts the API rate limit.
      - name: Build flamapy wheels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make build-wheels

      - name: Build
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          # GA4 measurement ID, inlined by Vite at build time (empty -> GA off),
          # matching the Docker build so the Pages site reports analytics too.
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
        run: npm run build

      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
